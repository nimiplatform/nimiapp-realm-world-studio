app_id: nimi.realm-world-studio
display_name: Realm World Studio
version: 0.1.6
profile: standalone
manifest_role: submitted-input
app_access:
  - realm.data
  - runtime.consume
  - app.activity
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1451
metadata:
  summary: 与 AI 共创世界设定与角色构想，审阅草稿，创建并整理自己的 Realm 世界。
  icon: assets/app-icon.png
  release_notes: RELEASE_NOTES.md
  author: Nimi Team
  homepage_url: https://github.com/nimiplatform/nimiapp-realm-world-studio
  support_url: https://github.com/nimiplatform/nimiapp-realm-world-studio/issues
capability_contract_refs:
  - text.generate
required_standardized_feature_refs: []
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: publishable
        publication_control: user-confirmed
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: false
    telemetry: []
    third_party_account: none
    user_content_sharing: public
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Electron userData>/**
      purpose: 保存语言偏好及 Electron/Chromium 运行所需的本地设置与缓存。创作草稿与 AI 候选通过 Nimi protected
        storage 保存，始终不是 Realm 正式资料。从 Nimi 卸载应用后，OS 本地文件仍会保留。
      expected_size_band: 语言偏好为少量文本；其余占用随 Chromium 缓存和使用情况变化，应用未设置缓存大小上限。
