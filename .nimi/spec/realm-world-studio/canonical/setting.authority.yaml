format: nimicoding.authority/v2
owner: team.realm-world-studio
scope: realm-world-studio.setting
units:
  - id: definition.realm-world-studio.setting.world-field-map
    kind: definition
    title: World field map
    meaning: "The admitted world field surface: world identity, summary, visibility, type, tags, ontology, time model, systems, rules, scenes, timeline, required WorldLorebookDeclarationV1 identity and base setting plus optional world rules and role placements, media references, and provenance present in WorldCoreDto.core or typed top-level WorldCoreDto fields."
  - id: definition.realm-world-studio.setting.character-field-map
    kind: definition
    title: Character field map
    meaning: "The admitted world-character field surface: settings, profile media, voice settings, behavior settings, required CharacterLorebookDeclarationV1 identity, behavior, speaking, immutable boundaries and optional relationship postures, source references, and provenance present in WorldCharacterCoreDto.core or typed top-level WorldCharacterCoreDto fields."
  - id: definition.realm-world-studio.setting.lorebook-declaration-field-map
    kind: definition
    title: World and Character lorebook declaration field map
    meaning: Realm World Studio exposes Realm-owned WorldLorebookDeclarationV1 on WorldCore create and replace and CharacterLorebookDeclarationV1 on WorldCharacterCore create and replace; Realm exclusively owns canonical source persistence and Packet issuance, Forge owns the unique executable schema, bounds and reference validation, normalization, hash, readiness, and Packet contract behavior, and Studio owns neither authority.
  - id: definition.realm-world-studio.setting.authority-metadata
    kind: definition
    title: Authority metadata
    meaning: Content hash, schema version, revision, origin, creatorId, worldId, and updatedAt are Realm authority metadata.
  - id: rule.realm-world-studio.setting.r001
    kind: rule
    title: Admitted world fields
    modality: must
    statement: World identity, summary, visibility, type, tags, ontology, time model, systems, rules, scenes, timeline, complete WorldLorebookDeclarationV1, media references, and provenance are admitted only when present in WorldCoreDto.core or typed top-level WorldCoreDto fields.
    condition: When Realm World Studio reads or writes creator-visible world fields.
    failure: Render a missing field as unavailable instead of admitting a value outside the typed WorldCoreDto surface.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.world-field-map
  - id: rule.realm-world-studio.setting.r002
    kind: rule
    title: Admitted character fields
    modality: must
    statement: World-character settings, profile media, voice settings, behavior settings, complete CharacterLorebookDeclarationV1, source references, and provenance are admitted only when present in WorldCharacterCoreDto.core or typed top-level WorldCharacterCoreDto fields.
    condition: When Realm World Studio reads or writes creator-visible world-character fields.
    failure: Render a missing field as unavailable instead of admitting a value outside the typed WorldCharacterCoreDto surface.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.character-field-map
  - id: rule.realm-world-studio.setting.r003
    kind: rule
    title: Faithful field projection
    modality: must
    statement: Creator-friendly projections of nested core payload fields preserve unavailable and unknown states.
    condition: When Realm World Studio projects a nested core payload field into a creator-friendly label.
    failure: Render the field as unavailable or unknown rather than substituting a value.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.character-field-map
      - type: applies_to
        target: definition.realm-world-studio.setting.world-field-map
  - id: rule.realm-world-studio.setting.r004
    kind: rule
    title: No missing-field concealment
    modality: must_not
    statement: Public DTOs, owner persona DTOs, generated defaults, or local placeholders hide missing source fields.
    condition: When a world or world-character source field is missing.
    failure: Render the field as unavailable or unknown and withhold source success.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.character-field-map
      - type: applies_to
        target: definition.realm-world-studio.setting.world-field-map
  - id: rule.realm-world-studio.setting.r005
    kind: rule
    title: Complete typed saves
    modality: must
    statement: Save actions submit complete typed Realm core DTO payloads with explicit origin and required content-hash preconditions.
    condition: When a creator submits a world or world-character save action.
    failure: Reject the save and preserve the creator draft when the typed payload, origin, or content-hash precondition is incomplete.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.core.realm-core-surfaces
  - id: rule.realm-world-studio.setting.r006
    kind: rule
    title: Realm-owned metadata
    modality: must
    statement: Content hash, schema version, revision, origin, creatorId, worldId, and updatedAt remain Realm-owned authority metadata and are only projected in diagnostics or workbench copy without local rewriting.
    condition: When authority metadata appears in diagnostics or creator workbench copy.
    failure: Render the metadata as unavailable when it cannot be projected without local rewriting.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.authority-metadata
  - id: rule.realm-world-studio.setting.r007
    kind: rule
    title: No alternate setting authority
    modality: must_not
    statement: Raw AgentRule CRUD, public showcase DTOs, owner persona settings, source connection anti-targets, or generated hidden fields serve as Realm World Studio setting authority.
    condition: Always.
    failure: Reject the alternate source and render the setting as unavailable.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.core.non-current-surfaces
  - id: rule.realm-world-studio.setting.r008
    kind: rule
    title: Save response authority
    modality: must
    statement: App-local draft validation may guide creators, while the Realm response after submit remains the only save success authority.
    condition: When a creator validates or submits an app-local draft.
    failure: Preserve the draft and withhold save success when no canonical Realm response is returned.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.core.local-candidate
  - id: rule.realm-world-studio.setting.r009
    kind: rule
    title: Unavailable contract fields
    modality: must
    statement: Form fields unavailable from current typed contracts render as capability unavailable or contract missing rather than disabled success controls.
    condition: When a requested form field is absent from current typed contracts.
    failure: Render capability unavailable or contract missing and withhold control success.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.character-field-map
      - type: applies_to
        target: definition.realm-world-studio.setting.world-field-map
  - id: rule.realm-world-studio.setting.r010
    kind: rule
    title: Lorebook declaration authoring is bounded
    modality: must
    statement: Realm World Studio requires WorldLorebookDeclarationV1 compact identity and base setting, permits explicit empty world-rule and role-placement lists, requires CharacterLorebookDeclarationV1 compact identity plus behavior, speaking, and immutable-boundary rows, permits explicit empty relationship-posture rows, validates all declared references, and enforces the Realm-owned Unicode-scalar, row-count, and total declaration bounds.
    condition: Whenever a creator creates, reviews, clears, or replaces a WorldCore or WorldCharacterCore lorebook declaration.
    failure: Preserve the creator draft and reject create or replace before the Realm call when a required container or field is missing, a declared reference is unresolved, or a bound is exceeded; never infer a long source field or inject a default.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.lorebook-declaration-field-map
  - id: rule.realm-world-studio.setting.r011
    kind: rule
    title: Canonical save confirms lorebook declarations
    modality: must
    statement: Realm World Studio reports lorebook declaration save success only from the canonical WorldCoreDto or WorldCharacterCoreDto returned by the existing Realm create or replace operation and reprojects the returned declaration without owning LocalAgent materialization, Cognition, prompt, or post-birth source adoption.
    condition: Whenever a world or world-character create or replace includes a lorebook declaration.
    failure: Preserve the creator draft and present the typed Realm validation, conflict, unavailable, or missing-canonical-object failure without local success or fallback.
    relations:
      - type: applies_to
        target: definition.realm-world-studio.setting.lorebook-declaration-field-map
