[package]
name = "nimiapp-realm-world-studio"
version = "0.1.0"
description = "Realm World Studio — Creator-facing operation desktop app for Realm worlds and creator characters."
authors = ["Nimi Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
nimi-shell-tauri = { path = "../../../nimi/kit/shell/tauri" }

[dev-dependencies]
tempfile = "3"
